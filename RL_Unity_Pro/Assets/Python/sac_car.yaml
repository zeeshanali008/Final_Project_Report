# =============================================
# SAC Configuration - Car Racing
# Run command: mlagents-learn sac_car.yaml --run-id=SAC_Run1
# =============================================

behaviors:
  CarAgent:
    trainer_type: sac        # Soft Actor-Critic algorithm

    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      batch_size: 256          # Har update mein kitne samples
      buffer_size: 50000       # Experience replay buffer
      tau: 0.005               # Target network update rate
      init_entcoef: 1.0        # Exploration rate (SAC unique feature)
      save_replay_buffer: false

    network_settings:
      normalize: true          # Observations normalize karo
      hidden_units: 256        # Neural network size
      num_layers: 2            # Network depth
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99            # Future reward discount
        strength: 1.0

    # Curiosity reward - naye areas explore karne pe bonus
      curiosity:
        gamma: 0.99
        strength: 0.02
        encoding_size: 256
        learning_rate: 3.0e-4

    max_steps: 1000000         # Total training steps
    time_horizon: 64           # Steps before update
    summary_freq: 10000        # Kitne steps pe save/log karo
    keep_checkpoints: 5
