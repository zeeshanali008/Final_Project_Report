# =============================================
# PPO Configuration - Car Racing (FINAL - TUTOR REVIEWED)
# Standardized parameters to match SAC for fair comparison
# Run command: mlagents-learn ppo_car.yaml --run-id=PPO_Run1
# =============================================

behaviors:
  CarAgent:
    trainer_type: ppo        # Proximal Policy Optimization algorithm

    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: linear  # Linearly decay learning rate over training
      batch_size: 64
      buffer_size: 4096  # On-policy buffer size for trajectory collection
      beta: 5.0e-3  # Entropy coefficient for exploration bonus
      epsilon: 0.2  # PPO clip parameter for policy gradient clipping
      lambd: 0.95  # Generalized Advantage Estimation (GAE) lambda
      num_epoch: 3  # Number of passes over buffer per update

    network_settings:
      normalize: true  # Normalize input observations
      hidden_units: 256  # Units per hidden layer
      num_layers: 2  # Number of hidden layers
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99  # Discount factor for future rewards
        strength: 1.0

      curiosity:  # Intrinsic reward for exploration
        gamma: 0.99
        strength: 0.02
        encoding_size: 256
        learning_rate: 3.0e-4

    max_steps: 1000000  # Total training steps
    time_horizon: 64  # Episode length before policy update
    summary_freq: 10000
    keep_checkpoints: 5